[project]
name = "bebeta-assistente"
version = "0.1.0"
description = "Personal assistant with semantic intent recognition, SQLite notes CRUD, TTS, and Rich terminal UI."
readme = "README.md"
authors = [
    { name = "CaioMtho", email = "caiomathol@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "gtts>=2.5.4",
    "numpy>=2.0.0",
    "pygame-ce>=2.5.0",
    "pyttsx3>=2.99",
    "rich>=13.9.0",
    "sentence-transformers>=3.0.0",
    "sounddevice>=0.5.6",
    "speechrecognition>=3.17.0",
]

[project.scripts]
bebeta-assistente = "pln_proj:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pln_proj"
